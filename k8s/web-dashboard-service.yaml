apiVersion: v1
kind: Service
metadata:
  name: web-dashboard-service
  namespace: besafe-network
  labels:
    app: web-dashboard
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    app: web-dashboard
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
