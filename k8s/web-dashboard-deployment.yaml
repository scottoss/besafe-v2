apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-dashboard
  namespace: besafe-network
  labels:
    app: web-dashboard
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: besafe
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web-dashboard
  template:
    metadata:
      labels:
        app: web-dashboard
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: web-dashboard
          image: ghcr.io/besafe-network/web-dashboard:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: "web-dashboard"
          envFrom:
            - configMapRef:
                name: besafe-config
            - secretRef:
                name: besafe-secrets
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
