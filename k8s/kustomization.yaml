apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: besafe-network

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - web-dashboard-deployment.yaml
  - web-dashboard-service.yaml
  - web-dashboard-ingress.yaml
  - vrchat-bot-deployment.yaml
  - vrchat-bot-service.yaml
