apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-dashboard-ingress
  namespace: besafe-network
  labels:
    app: web-dashboard
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  tls:
    - hosts:
        - besafe.network
        - www.besafe.network
      secretName: besafe-tls-cert
  rules:
    - host: besafe.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-dashboard-service
                port:
                  number: 80
    - host: www.besafe.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-dashboard-service
                port:
                  number: 80
