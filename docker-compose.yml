version: '3.8'

services:
  # --- MongoDB Database ---
  mongo:
    image: mongo:7-jammy
    container_name: besafe-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: besafe
    volumes:
      - mongo-data:/data/db

  # --- Service 1: Web Dashboard & Main API ---
  web-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: besafe-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - SERVICE_NAME=web-dashboard
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/besafe
      - VRCHAT_SERVICE_URL=http://vrchat-bot:3001
      - DISCORD_SERVICE_URL=http://discord-bot:3002
      - JWT_SECRET=besafe-super-secret-jwt-key
      - APP_URL=http://localhost:3000
    depends_on:
      - mongo

  # --- Service 2: VRChat Bot API & Worker ---
  vrchat-bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.vrchat
    container_name: besafe-vrchat-bot
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - SERVICE_NAME=vrchat-bot
      - VRCHAT_BOT_PORT=3001
      - MONGO_URI=mongodb://mongo:27017/besafe
      - VRC_INSTANCE_ID=0
      - VRC_TOTAL_INSTANCES=1
    depends_on:
      - mongo

  # --- Service 3: Discord Bot Service (Shard 0) ---
  discord-bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.discord
    container_name: besafe-discord-bot
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - SERVICE_NAME=discord-bot
      - DISCORD_BOT_PORT=3002
      - MONGO_URI=mongodb://mongo:27017/besafe
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_SHARDING_MODE=stateful
      - SHARD_ID=0
      - SHARD_COUNT=1
    depends_on:
      - mongo

volumes:
  mongo-data:
